<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | BellaZona</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <div class="barra">
            <a href="index.html" class="logo"><span>B</span> BellaZona</a>
            <nav>
                <a href="index.html">Catalogo</a>
                <a href="carrito.html">Carrito <span class="globo" id="contador">0</span></a>
                <a href="admin.html" class="activo">Administrador</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- pantalla de ingreso -->
        <section class="login" id="pantalla-login">
            <h2>Ingreso del administrador</h2>

            <form class="formulario" id="form-login">
                <div>
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" style="width: 100%;" required>
                </div>
                <div>
                    <label for="clave">Clave</label>
                    <input type="password" id="clave" style="width: 100%;" required>
                </div>

                <button type="submit" class="boton ancho">Entrar</button>
            </form>

            <p class="texto-gris" id="error-login" style="margin-top: 12px;"></p>
        </section>

        <!-- panel del administrador -->
        <section class="escondido" id="pantalla-panel">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <div>
                    <h2 class="titulo">Panel de productos</h2>
                    <p class="texto-gris">Desde aqui puedes crear, editar y borrar los productos de la tienda.</p>
                </div>
                <button class="boton borde chico" id="boton-salir">Cerrar sesion</button>
            </div>

            <p class="aviso escondido" id="aviso"></p>

            <div class="dos-columnas" style="margin-top: 24px;">

                <div class="tabla-caja">
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos"></tbody>
                    </table>
                </div>

                <div class="caja" style="margin-top: 0;">
                    <h3 style="margin-top: 0;" id="titulo-form">Nuevo producto</h3>

                    <form class="formulario" id="form-producto">
                        <input type="hidden" id="id-producto">

                        <div>
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" style="width: 100%;" required>
                        </div>

                        <div>
                            <label for="categoria">Categoria</label>
                            <select id="categoria" style="width: 100%;">
                                <option value="Rostro">Rostro</option>
                                <option value="Ojos y labios">Ojos y labios</option>
                                <option value="Brochas">Brochas</option>
                            </select>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <div style="flex: 1;">
                                <label for="precio">Precio</label>
                                <input type="number" id="precio" style="width: 100%;" min="1" required>
                            </div>
                            <div style="flex: 1;">
                                <label for="stock">Stock</label>
                                <input type="number" id="stock" style="width: 100%;" min="0" required>
                            </div>
                        </div>

                        <div>
                            <label for="descripcion">Descripcion</label>
                            <textarea id="descripcion" rows="3" style="width: 100%;"></textarea>
                        </div>

                        <div>
                            <label for="imagenArchivo">Imagen desde el computador (maximo 2 MB)</label>
                            <input type="file" id="imagenArchivo" accept="image/*" style="width: 100%;">
                        </div>

                        <img id="vista-previa" class="vista-previa escondido" alt="Vista previa de la imagen">

                        <div>
                            <label for="imagen">O pegar el link de una imagen</label>
                            <input type="text" id="imagen" placeholder="https://..." style="width: 100%;">
                        </div>

                        <button type="submit" class="boton ancho" id="boton-guardar">Guardar producto</button>
                        <button type="button" class="boton borde ancho escondido" id="boton-cancelar">Cancelar edicion</button>
                    </form>
                </div>

            </div>

            <h3 class="subtitulo">Compras realizadas</h3>

            <div class="tabla-caja">
                <table>
                    <thead>
                        <tr>
                            <th>N.</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Productos</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-ventas"></tbody>
                </table>
            </div>

        </section>

    </main>

    <footer>BellaZona - Proyecto formativo SENA</footer>

    <script src="js/comun.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
